<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Productos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6">

  <h1 class="text-2xl font-bold mb-4">Gestión de Productos</h1>

  <form id="formProducto" class="flex flex-col gap-2 mb-6">
    <label>Código:
      <input type="text" id="codigo" required class="border p-1" />
    </label>
    <label>Nombre:
      <input type="text" id="nombre" required class="border p-1" />
    </label>
    <label>Precio:
      <input type="number" id="precio" required class="border p-1" />
    </label>
    <label>Imagen (url):
      <input type="text" id="imagen" required class="border p-1" />
    </label>
    <button type="submit" class="bg-blue-500 text-white p-2">
      Agregar producto
    </button>
  </form>

  <table class="border w-full">
    <thead class="bg-gray-200">
      <tr>
        <th class="border p-2">Código</th>
        <th class="border p-2">Nombre</th>
        <th class="border p-2">Precio</th>
        <th class="border p-2">Imagen</th>
        <th class="border p-2">Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaProductos">
    </tbody>
  </table>

  <script type="module" src="index.js"></script>
</body>
</html>
